  name: 查询 WiFi 同步配置
  description: 读取 wlanwifisync 端点，返回 WiFi 同步配置。
  fields: {}
lan_config_get:
  name: 查询 LAN 配置
  description: 读取 lan 端点，返回 LAN 基础配置。
  fields: {}
lan_config_set:
  name: 设置 LAN 配置
  description: 修改 LAN 的 IP、子网掩码或 DHCP 开关（GET→改→POST）。
  fields:
    ip_address:
      name: LAN IP
      description: 路由器 LAN 口 IP 地址。
      required: false
      example: "192.168.3.1"
      selector:
        text:
    netmask:
      name: 子网掩码
      description: LAN 子网掩码。
      required: false
      example: "255.255.255.0"
      selector:
        text:
    dhcp_enabled:
      name: DHCP 开关
      description: 是否启用 LAN 侧 DHCP 服务。
      required: false
      example: true
      selector:
        boolean:
lan_all_get:
  name: 查询 LAN 完整配置
  description: 读取 lan_all 端点，返回 LAN 完整配置。
  fields: {}
dhcp_server_get:
  name: 查询 DHCP 服务配置
  description: 读取 lan_server 端点，返回 DHCP 服务器配置。
  fields: {}
dhcp_server_set:
  name: 设置 DHCP 服务
  description: 修改 DHCP 地址池起止、租期或开关（GET→改→POST）。
  fields:
    start_ip:
      name: 起始地址
      description: DHCP 地址池起始 IP。
      required: false
      example: "192.168.3.100"
      selector:
        text:
    end_ip:
      name: 结束地址
      description: DHCP 地址池结束 IP。
      required: false
      example: "192.168.3.200"
      selector:
        text:
    lease_time:
      name: 租期
      description: 租期（秒）。
      required: false
      example: 86400
      selector:
        number:
          min: 60
          max: 604800
          unit_of_measurement: "s"
          mode: box
    enabled:
      name: 启用
      description: 是否启用 DHCP 服务。
      required: false
      example: true
      selector:
        boolean:
