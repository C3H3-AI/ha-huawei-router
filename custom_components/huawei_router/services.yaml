wifi_timing_accelerate_set:
  name: 设置 WiFi 加速
  description: 启用或禁用 WiFi 加速，可通过 data 覆盖其他字段。
  fields:
    enabled:
      name: 启用
      description: 是否启用 WiFi 加速。
      required: true
      example: true
      selector:
        boolean:
