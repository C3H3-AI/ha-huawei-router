wifi_radio_get:
  name: 查询射频配置
  description: 读取 wlanradio 端点，返回各频段射频配置。
  fields: {}
wifi_radio_set_enabled:
  name: 设置射频开关
  description: 按频段启用或禁用 WiFi 射频（字段名由 GET 返回推断）。
  fields:
    frequency:
      name: 频段
      description: 目标频段。
      required: true
      example: "2.4G"
      selector:
        select:
          options:
            - "2.4G"
            - "5G"
    enabled:
      name: 启用
      description: 是否启用该射频。
      required: true
      example: true
      selector:
        boolean:
wlan_wps_get:
  name: 查询 WPS 配置
  description: 读取 wlanwps 端点，返回 WPS 配置。
  fields: {}
wps_set_enabled:
  name: 设置 WPS 开关
  description: 启用或禁用 WPS（字段 WpsEnable）。
  fields:
    enabled:
      name: 启用
      description: 是否启用 WPS。
      required: true
      example: true
      selector:
        boolean:
multi_ssid_list:
  name: 列出多 SSID
  description: 列出路由器多个 SSID 的配置。
  fields: {}
wifi_timing_accelerate_get:
  name: 查询 WiFi 加速配置
